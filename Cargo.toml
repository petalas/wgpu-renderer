[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.86"
bytemuck = { version = "1.17.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
futures-intrusive = "0.5.0"
getrandom = { version = "0.2.15", features = ["js"] }
image = "0.25.2"
js-sys = "0.3.70"
log = "0.4.22"
rand = "0.8.5"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
wasm-timer = "0.2.5"
web-sys = { version = "0.3.70", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "console", "ImageData", "OffscreenCanvas", "HtmlImageElement"] }
wgpu = { version = "22.1.0" }
